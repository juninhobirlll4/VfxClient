# Memória do daemon do Gradle (o remapeamento do Minecraft pede bastante).
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# ------------------------------------------------------------------
# VfxClient
# ------------------------------------------------------------------
# Versão do client. A CI sobrescreve com a tag (ex.: v0.1.0 -> 0.1.0).
client_version=0.16.0
maven_group=com.vfxclient
# Servidor do VfxClient na Cloudflare (emotes e skins; veja relay/). Vale para o mod e o launcher.
services_url=https://vfx-emotes.vfxclient-sand.workers.dev

# ------------------------------------------------------------------
# Legacy Fabric (mod core)
# Versões disponíveis em https://legacyfabric.net/usage.html
# ------------------------------------------------------------------
minecraft_version=1.8.9
yarn_build=604
loader_version=0.18.3
loom_version=1.16-SNAPSHOT

# Java usado pelo "runClient" no desenvolvimento. A 1.8.9 (LWJGL 2) roda
# melhor em Java 8; se o Gradle não achar seu JDK 8, troque para 21.
run_java_version=8

# ------------------------------------------------------------------
# Launcher
# ------------------------------------------------------------------
javafx_version=21.0.5
