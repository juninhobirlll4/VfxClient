# Servidor de emotes do VfxClient. Publicar: veja relay/README.md.
name = "vfx-emotes"
main = "src/index.js"
compatibility_date = "2025-06-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "EmoteRoom"

# Durable Objects com SQLite: disponível no plano gratuito.
[[durable_objects.bindings]]
name = "SKINS"
class_name = "SkinStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["EmoteRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SkinStore"]
